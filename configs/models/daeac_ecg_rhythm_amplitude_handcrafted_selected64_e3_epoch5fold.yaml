# 在每折训练集内筛选64项手工特征，再与 DAEAC ECG/辅助序列表示融合。
name: daeac_filtered_rhythm_amplitude_handcrafted_selected64_e3_epoch5fold_2class
data_path: ../dataset/mitbih_master/mitbih_master_30s.npz
handcrafted_path: ../../EDR/outputs/slpdb_paper_aligned_v1/handcrafted_v1/features_30s.npz
handcrafted_selection_dir: protocols/handcrafted_selection_e3_auc_corr_k64
split_dir: protocols/e3_full_epoch5fold_20260913
split_unit: epoch
output_root: runs

signal_key: ecg_filtered_rri_r_amp_256_handcrafted_all
normalization: per_epoch_zscore
expected_input_length: 7500
model: daeac
model_params:
  base_channels: 16
  dilations: [1, 6, 12, 18]
  activation: relu
  final_activation: relu
  use_rhythm_amplitude: true
  use_third_aspp: false
  use_handcrafted: true
  handcrafted_dim: 64
  handcrafted_hidden_dim: 128
  handcrafted_dropout: 0.2
labels: [Normal, Apnea]

batch_size: 8
learning_rate: 0.001
weight_decay: 0.0001
max_epochs: 120
early_stopping_patience: 20
class_weight: balanced
checkpoint_metric: val_macro_f1

seed: 17
fold: 0
num_workers: 0
device: auto
