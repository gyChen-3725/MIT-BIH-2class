# 与三分类仓库 E3 对齐折成员；波形和训练超参数沿用本项目二分类配置。
name: daeac_raw_e3_epoch5fold_2class
data_path: ../dataset/mitbih_master/mitbih_master_30s.npz
split_dir: protocols/e3_full_epoch5fold_20260913
split_unit: epoch
output_root: runs

signal_key: ecg_raw
normalization: per_epoch_zscore
expected_input_length: 7500
model: daeac
model_params:
  base_channels: 16
  dilations: [1, 6, 12, 18]
  activation: relu
  final_activation: relu
labels: [Normal, Apnea]

batch_size: 8
learning_rate: 0.001
weight_decay: 0.0001
max_epochs: 120
early_stopping_patience: 20
class_weight: balanced

seed: 17
fold: 0
num_workers: 0
device: auto
