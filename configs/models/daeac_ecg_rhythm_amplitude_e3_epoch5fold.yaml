# 在已有 ECG 基线的相同 E3 样本级五折上比较三模态输入。
# RRI 和 R 峰幅度直接读取 MIT-BIH master 的同一行 rri_256/r_amp_256。
name: daeac_filtered_rhythm_amplitude_e3_epoch5fold_2class
data_path: ../dataset/mitbih_master/mitbih_master_30s.npz
split_dir: protocols/e3_full_epoch5fold_20260913
split_unit: epoch
output_root: runs

signal_key: ecg_filtered_rri_r_amp_256
normalization: per_epoch_zscore
expected_input_length: 7500
model: daeac
model_params:
  base_channels: 16
  dilations: [1, 6, 12, 18]
  activation: relu
  final_activation: relu
  use_rhythm_amplitude: true
labels: [Normal, Apnea]

batch_size: 8
learning_rate: 0.001
weight_decay: 0.0001
max_epochs: 120
early_stopping_patience: 20
class_weight: balanced

seed: 17
fold: 0
num_workers: 0
device: auto
