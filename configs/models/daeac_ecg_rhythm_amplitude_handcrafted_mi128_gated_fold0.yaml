# Fold 0：DAEAC + 机器学习最优MI-128手工特征的可学习门控融合。
# 特征配方来自Fold 0验证搜索最优项 fusion3_expanded + mutual_info + 128维。
name: daeac_filtered_rhythm_amplitude_handcrafted_mi128_gated_fold0_2class
data_path: ../dataset/mitbih_master/mitbih_master_30s.npz
handcrafted_path: features/expanded347/features_30s_expanded.npz
handcrafted_selection_dir: protocols/handcrafted_selection_expanded347_ml_best_fold0
split_dir: protocols/e3_full_epoch5fold_20260913
split_unit: epoch
output_root: runs

signal_key: ecg_filtered_rri_r_amp_256_handcrafted_all
normalization: per_epoch_zscore
expected_input_length: 7500
model: daeac
model_params:
  base_channels: 16
  dilations: [1, 6, 12, 18]
  activation: relu
  final_activation: relu
  use_rhythm_amplitude: true
  use_third_aspp: false
  use_handcrafted: true
  handcrafted_dim: 128
  handcrafted_hidden_dim: 64
  handcrafted_dropout: 0.2
  use_handcrafted_gate: true
  handcrafted_gate_init: 0.05
labels: [Normal, Apnea]

# 与原始DAEAC及mRMR-64融合保持相同优化设置，只改变特征配方和融合门控。
batch_size: 8
learning_rate: 0.001
weight_decay: 0.0001
max_epochs: 120
early_stopping_patience: 20
class_weight: balanced
checkpoint_metric: val_macro_f1

seed: 17
fold: 0
num_workers: 0
device: auto
