# BAFNet 的 30 秒双路特征适配；五折索引与 DAEAC E3 二分类实验相同。
name: bafnet_rri_amp_30s_e3_epoch5fold_2class
data_path: ../dataset/mitbih_master/mitbih_master_30s.npz
split_dir: protocols/e3_full_epoch5fold_20260913
split_unit: epoch
output_root: runs

signal_key: rri_r_amp_256
normalization: per_channel_minmax
expected_input_length: 256
model: bafnet
model_params:
  reconstruction_weight: 1.0
labels: [Normal, Apnea]

batch_size: 64
learning_rate: 0.001
weight_decay: 0.0001
max_epochs: 120
early_stopping_patience: 20
class_weight: balanced

seed: 17
fold: 0
num_workers: 0
device: auto
